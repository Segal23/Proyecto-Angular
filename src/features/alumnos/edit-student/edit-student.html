<h2>Detalle del estudiante</h2>
<form [formGroup]="editStudent" class="edit-form">
    <mat-form-field appearance="outline" >
        <mat-label>DNI</mat-label>
        <input matInput formControlName="dni" readonly />
    </mat-form-field>

    <mat-form-field appearance="outline">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="name" />
    </mat-form-field>

    <mat-form-field appearance="outline">
        <mat-label>Apellido</mat-label>
        <input matInput formControlName="surname"/>
    </mat-form-field>

    <mat-form-field appearance="outline">
        <mat-label>Edad</mat-label>
        <input type="number" matInput formControlName="age" />
    </mat-form-field>

    <mat-form-field appearance="outline">
        <mat-label>Promedio</mat-label>
        <input type="number" matInput formControlName="average" />
    </mat-form-field>

    <button type="submit" (click)="onSubmit()" [disabled]="editStudent.invalid">Actualizar</button>
</form>
