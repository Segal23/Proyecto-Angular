<h2>Detalle del estudiante</h2>
<form [formGroup]="editStudent" class="edit-form">

    <div class="form-row">
        <mat-form-field appearance="outline" >
            <mat-label>DNI</mat-label>
            <input matInput formControlName="dni" (blur)="validarCampos()" readonly class="input-dni" />
        </mat-form-field>
    </div>
    
    <div class="form-row">
        <mat-form-field appearance="outline">
            <mat-label>Nombre</mat-label>
            <input matInput formControlName="name" (blur)="validarCampos()" />
        </mat-form-field>
    
        <mat-form-field appearance="outline">
            <mat-label>Apellido</mat-label>
            <input matInput formControlName="surname" (blur)="validarCampos()"/>
        </mat-form-field>
    </div>

    <div class="form-row">
        <mat-form-field appearance="outline">
            <mat-label>Edad</mat-label>
            <input type="number" matInput formControlName="age" (blur)="validarCampos()" />
        </mat-form-field>
    
        <mat-form-field appearance="outline">
            <mat-label>Promedio</mat-label>
            <input type="number" matInput formControlName="average" (blur)="validarCampos()" />
        </mat-form-field>
    </div>

    <button type="submit" (click)="onSubmit()">Actualizar</button>
</form>
