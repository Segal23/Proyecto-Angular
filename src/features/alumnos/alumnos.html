<div *ngIf="alumnos$ | async as alumnos; else loading">
    <app-students-table (editEvent)="editStudent($event)" (deleteEvent)="deleteStudent($event)" [students]="alumnos"></app-students-table>
</div>

<ng-template #loading>
    <div class="spinner-container">
        <mat-spinner diameter="40"></mat-spinner>
        <p class="loading-text">Cargando alumnos...</p>
    </div>
</ng-template>
