<h2>Detalle de la inscripción</h2>
<form [formGroup]="editInscription" class="edit-form">

    <div class="form-row">
        <mat-form-field appearance="outline" >
            <mat-label>Student DNI</mat-label>
            <input matInput formControlName="studentDNI" readonly class="input-dni"/>
        </mat-form-field>
    </div>

    <div class="form-row">
        <mat-form-field appearance="outline">
            <mat-label>Course Code</mat-label>
            <input matInput formControlName="courseCode" />
        </mat-form-field>
    </div>

    <div class="form-row">
        <mat-form-field appearance="outline">
            <mat-label>Grade</mat-label>
            <input type="number" matInput formControlName="grade"/>
        </mat-form-field>
    </div>

    <div class="form-row">
        <mat-form-field appearance="outline">
            <mat-label>Status</mat-label>
            <input matInput formControlName="status" />
        </mat-form-field>
    </div>

    <button type="submit" (click)="onSubmit()" [disabled]="editInscription.invalid">Actualizar</button>
</form>
