<h2>Detalle de la inscripción</h2>
<form [formGroup]="editInscription" class="edit-form">

    <div class="form-row">
        <mat-form-field appearance="outline" >
            <mat-label>DNI Alumno</mat-label>
            <input matInput formControlName="studentDNI" readonly class="input-dni" (blur)="validarCampos()"/>
        </mat-form-field>
    </div>

    <div class="form-row">
        <mat-form-field appearance="outline">
            <mat-label>Código Curso</mat-label>
            <input matInput formControlName="courseCode" (blur)="validarCampos()"/>
        </mat-form-field>
    </div>

    <div class="form-row">
        <mat-form-field appearance="outline">
            <mat-label>Grado</mat-label>
            <input type="number" matInput formControlName="grade" (blur)="validarCampos()"/>
        </mat-form-field>
    </div>

    <div class="form-row">
        <mat-form-field appearance="outline">
            <mat-label>Estado</mat-label>
            <input matInput formControlName="status" (blur)="validarCampos()" />
        </mat-form-field>
    </div>

    <button type="submit" (click)="onSubmit()" >Actualizar</button>
</form>
