<h2>Detalle de la inscripción</h2>
<form [formGroup]="viewInscription" class="view-form">

    <div class="form-row">
        <mat-form-field appearance="outline" >
            <mat-label>Student DNI</mat-label>
            <input type="number" matInput formControlName="studentDNI" readonly />
        </mat-form-field>
    </div>

    <div class="form-row">
        <mat-form-field appearance="outline">
            <mat-label>Course Code</mat-label>
            <input matInput formControlName="courseCode" readonly />
        </mat-form-field>
    </div>
    
    <div class="form-row">
        <mat-form-field appearance="outline">
            <mat-label>Grade</mat-label>
            <input type="number" matInput formControlName="grade" readonly/>
        </mat-form-field>
    </div>

    <div class="form-row">
        <mat-form-field appearance="outline">
            <mat-label>Status</mat-label>
            <input matInput formControlName="status" readonly />
        </mat-form-field>
    </div>
</form>
