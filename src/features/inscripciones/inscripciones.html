<div *ngIf="inscripciones$ | async as inscripciones; else loading">
    <app-inscriptions-table (editEvent)="editInscription($event)" (deleteEvent)="deleteInscription($event)" [inscriptions]="inscripciones"></app-inscriptions-table>
</div>

<ng-template #loading>
    <div class="spinner-container">
        <mat-spinner diameter="40"></mat-spinner>
        <p class="loading-text">Cargando inscripciones...</p>
    </div>
</ng-template>
