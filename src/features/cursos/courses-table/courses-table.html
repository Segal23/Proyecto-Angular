<table mat-table [dataSource]="courses" class="mat-elevation-z8">

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let element"> {{element.name}} </td>
    </ng-container>

    <ng-container matColumnDef="code">
      <th mat-header-cell *matHeaderCellDef>Code</th>
      <td mat-cell *matCellDef="let element"> {{element.code}} </td>
    </ng-container>

    <ng-container matColumnDef="credits">
      <th mat-header-cell *matHeaderCellDef>credits</th>
      <td mat-cell *matCellDef="let element"> {{element.credits}} </td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let element"> {{element.description}} </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let element"> {{element.actions}} 
        <button (click)="viewDetails(element)" matTooltip="Ver">
            <mat-icon class="view-icon">visibility</mat-icon>
        </button>
        <button *ngIf="(authService.role$ | async) === 'admin'" (click)="editCourse(element)" matTooltip="Editar">
            <mat-icon class="edit-icon">edit</mat-icon>
        </button>  
        <button *ngIf="(authService.role$ | async) === 'admin'" (click)="deleteCourse(element)" matTooltip="Eliminar">
          <mat-icon class="delete-icon">delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
