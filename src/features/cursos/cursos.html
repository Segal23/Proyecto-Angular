<div *ngIf="cursos$ | async as cursos; else loading">
    <app-courses-table (editEvent)="editCourse($event)" (deleteEvent)="deleteCourse($event)" [courses]="cursos"></app-courses-table>
</div>

<ng-template #loading>
    <div class="spinner-container">
        <mat-spinner diameter="40"></mat-spinner>
        <p class="loading-text">Cargando cursos...</p>
    </div>
</ng-template>
