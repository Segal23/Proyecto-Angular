<h2>Detalle del estudiante</h2>
<form [formGroup]="editCourse" class="edit-form">

    <div class="form-row">
        <mat-form-field appearance="outline" >
            <mat-label>Nombre</mat-label>
            <input matInput formControlName="name" (blur)="validarCampos()" />
        </mat-form-field>
    </div>

    <div class="form-row">
        <mat-form-field appearance="outline">
            <mat-label>Código</mat-label>
            <input matInput formControlName="code" (blur)="validarCampos()" />
        </mat-form-field>
    </div>

    <div class="form-row">
        <mat-form-field appearance="outline">
            <mat-label>Créditos</mat-label>
            <input type="number" matInput formControlName="credits" (blur)="validarCampos()"/>
        </mat-form-field>
    </div>

    <div class="form-row">
        <mat-form-field appearance="outline">
            <mat-label>Descripción</mat-label>
            <input matInput formControlName="description" (blur)="validarCampos()"/>
        </mat-form-field>
    </div>

    <button type="submit" (click)="onSubmit()">Actualizar</button>
</form>
