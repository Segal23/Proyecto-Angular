<div class="login-container">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <!-- Campo Usuario -->
        <div class="form-group">
            <label for="username">Usuario</label>
            <input id="username" type="text" formControlName="username" />
            <div class="error" *ngIf="submitted && username?.errors">
                <small *ngIf="username?.errors?.['required']">El usuario es obligatorio.</small>
                <small *ngIf="username?.errors?.['pattern']">Solo letras y números.</small>
            </div>
        </div>

        <!-- Campo Contraseña -->
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input id="password" type="password" formControlName="password" />
            <div class="error" *ngIf="submitted && password?.errors">
                <small *ngIf="password?.errors?.['required']">La contraseña es obligatoria.</small>
                <small *ngIf="password?.errors?.['minlength']">Mínimo 8 caracteres.</small>
                <small *ngIf="password?.errors?.['pattern']">Debe incluir mayúscula, minúscula, número y un carácter especial.</small>
            </div>
        </div>

        <!-- Error general de login -->
        <div class="error" *ngIf="errorMsg">
            <small>{{ errorMsg }}</small>
        </div>

        <button type="submit">Ingresar</button>
    </form>
</div>
